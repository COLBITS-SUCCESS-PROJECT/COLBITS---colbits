version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: colbits-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: colbits
    ports:
      - "5432:5432"
    volumes:
      - ./01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql
      - ./02_dummy_inserts.sql:/docker-entrypoint-initdb.d/02_dummy_inserts.sql
      - ./03_security_schema.sql:/docker-entrypoint-initdb.d/03_security_schema.sql

  pgadmin:
    image: dpage/pgadmin4
    container_name: colbits-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@colbits.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8888:80"
    depends_on:
      - postgres