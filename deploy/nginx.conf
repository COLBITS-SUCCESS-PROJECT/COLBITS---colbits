# nginx inside the app1 container. Caddy (Colbits) handles HTTPS and forwards every visit here.
server {
  listen 80;
  root /usr/share/nginx/html;

  # API calls go to the backend container; "/api" is removed, so /api/nodes reaches /nodes.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Single-page app: every route (/login, /dashboard…) is served by index.html.
  location / {
    try_files $uri /index.html;
  }
}
