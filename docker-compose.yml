version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: colbits-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: colbits
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: colbits-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@colbits.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "8888:80"
    depends_on:
      - postgres