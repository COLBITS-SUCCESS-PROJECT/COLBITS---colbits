name: PR standards

# Checks that every PR follows the team conventions (CONTRIBUTING.md): branch name, title,
# target branch, AI-use declaration and a filled-in description.
# Re-runs by itself when the title or description is edited.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-standards:
    name: pr-standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts

      - uses: actions/github-script@v7
        with:
          script: |
            const { checkPullRequest } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-standards.js`)
            const pr = context.payload.pull_request
            const errors = checkPullRequest({
              branch: pr.head.ref,
              base: pr.base.ref,
              title: pr.title,
              body: pr.body,
            })

            if (errors.length) {
              await core.summary
                .addHeading('PR standards — to fix')
                .addList(errors)
                .addRaw('Edit the PR title or description and this check runs again by itself. Guide: CONTRIBUTING.md')
                .write()
              core.setFailed(errors.join('\n'))
            } else {
              await core.summary.addHeading('PR standards — all good ✅').write()
            }
