# Whole COLBITS stack for local development: `docker compose up` from the repo root.
#   Frontend  http://localhost:47173
#   Backend   http://localhost:3000
#   pgAdmin   http://localhost:8888
#   Postgres  localhost:5432
# Values come from the root .env (copy .env.example); the defaults below are used otherwise.
# Each app can still run on its own with frontend/docker-compose.yml or backend/docker-compose.yml.
services:
  postgres:
    image: postgres:15
    container_name: colbits-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-adminpassword}
      POSTGRES_DB: ${DB_NAME:-colbits}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      # Tables and sample data are created only the first time (empty volume).
      - ./backend/database:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-colbits}']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: colbits-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@colbits.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - '8888:80'
    depends_on:
      - postgres

  backend:
    build: ./backend
    image: colbits-backend-dev
    container_name: colbits-backend
    ports:
      - '3000:3000'
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-adminpassword}
      DB_NAME: ${DB_NAME:-colbits}
      FALCON_INACTIVITY_HOURS: ${FALCON_INACTIVITY_HOURS:-9}
      SMAC_INACTIVITY_HOURS: ${SMAC_INACTIVITY_HOURS:-3}
      # File events do not cross the Windows/macOS → Docker boundary; poll instead.
      TSC_WATCHFILE: DynamicPriorityPolling
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./backend:/app
      # Keep the container's Linux node_modules; never mix them with the host's.
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: colbits-frontend-dev
    container_name: colbits-frontend
    ports:
      - '47173:47173'
    environment:
      # The browser calls the API, so it uses the host address, not the service name.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
      VITE_APP_ENV: ${VITE_APP_ENV:-development}
      VITE_ENABLE_MSW: ${VITE_ENABLE_MSW:-true}
      VITE_DEV_MOCK_SESSION: ${VITE_DEV_MOCK_SESSION:-true}
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
